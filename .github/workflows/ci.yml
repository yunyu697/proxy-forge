name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: 检查（lint + typecheck + 测试 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（协议解析 + 双内核生成）
        run: npm test

      - name: 生产构建
        run: npm run build

  desktop:
    name: 桌面端打包（${{ matrix.label }}）
    needs: test
    # 只在打 v* 标签时构建，产物直接附加到对应的 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            # universal 二进制：同时支持 Apple Silicon 与 Intel
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            artifact: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            platform: darwin
          - os: windows-latest
            label: Windows
            targets: ''
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
            platform: windows
          - os: ubuntu-22.04
            label: Linux
            targets: ''
            args: --bundles appimage deb
            artifact: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 需要 webkit2gtk 等系统依赖
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装依赖
        run: npm ci

      - name: 打包（构建号取 run number）
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          # 自动更新签名密钥（仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ProxyForge-${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn

      - name: 生成更新器清单
        env:
          UPDATE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: node scripts/gen-updater-manifest.mjs "updater-${{ matrix.platform }}.json"

      - name: 附加产物到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FILES=$(ls ${{ matrix.artifact }} 2>/dev/null | tr '\n' ' ')
          gh release upload "$GITHUB_REF_NAME" --clobber $FILES "updater-${{ matrix.platform }}.json"

  publish-updater:
    name: 合并更新器清单
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载三平台清单并合并为 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n updater-darwin.json -D updater/
          gh run download "$GITHUB_RUN_ID" -n updater-windows.json -D updater/
          gh run download "$GITHUB_RUN_ID" -n updater-linux.json -D updater/
          node scripts/merge-updater-manifest.mjs updater/ > latest.json

      - name: 上传 latest.json 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
