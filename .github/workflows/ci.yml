name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: 类型检查 + 冒烟测试 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 冒烟测试（协议解析 + 双内核生成）
        run: npm run smoke

      - name: 生产构建
        run: npm run build

  desktop:
    name: 桌面端打包（${{ matrix.label }}）
    needs: test
    # 只在打 v* 标签时构建，产物即对应平台的安装包
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            args: --bundles dmg
            artifact: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: Windows
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            label: Linux
            args: --bundles appimage deb
            artifact: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 需要 webkit2gtk 等系统依赖
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装依赖
        run: npm ci

      - name: 打包（构建号取 run number）
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ProxyForge-${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
