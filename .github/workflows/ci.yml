name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 发布相关 job 需要向 GitHub Release 上传产物
permissions:
  contents: write

jobs:
  test:
    name: 检查（lint + typecheck + 测试 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（协议解析 + 双内核生成）
        run: npm test

      - name: 生产构建
        run: npm run build

  # 打 v* 标签时先创建一个 GitHub Release，后续桌面端 / Android job 往里挂产物
  release:
    name: 创建 Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ProxyForge $GITHUB_REF_NAME" \
            --generate-notes \
            --latest || echo "Release 已存在，继续"

  desktop:
    name: 桌面端打包（${{ matrix.label }}）
    needs: [test, release]
    # 只在打 v* 标签时构建，产物直接附加到对应的 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            # universal 二进制：同时支持 Apple Silicon 与 Intel
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundle_path: src-tauri/target/universal-apple-darwin/release/bundle/**
            platform: darwin
          - os: windows-latest
            label: Windows
            targets: ''
            args: --bundles nsis,msi
            bundle_path: src-tauri/target/release/bundle/**
            platform: windows
          - os: ubuntu-22.04
            label: Linux
            targets: ''
            args: --bundles appimage,deb,rpm
            bundle_path: src-tauri/target/release/bundle/**
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 需要 webkit2gtk 等系统依赖
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      # Windows 的 MSI 打包依赖 WiX Toolset（runner 默认未安装）
      - name: 安装 WiX Toolset（MSI 打包依赖）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath C:\wix
          echo "C:\wix" >> $env:GITHUB_PATH

      - name: 安装依赖
        run: npm ci

      - name: 打包（构建号取 run number）
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          # 自动更新签名密钥（仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD）
          # 未配置时优雅降级：不生成 .sig，更新器清单对应平台为空
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- ${{ matrix.args }}

      # Windows：额外生成便携 zip（单 exe 绿色版，用户要求）
      # 注意 1：Windows runner 的 Git bash 里没有 zip 命令（会 exit 127），改用 PowerShell 的 Compress-Archive。
      # 注意 2：可执行文件名来自 Cargo 包名（proxy-forge.exe），不是 productName（ProxyForge），
      #        所以这里按通配符查找，避免写死文件名后再次失败。
      - name: 生成便携 zip（Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $rel = (Resolve-Path "src-tauri/target/release").Path
          $exe = Get-ChildItem -Path $rel -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "未在 $rel 找到 exe，打包未产出可执行文件" }
          Write-Host "使用可执行文件：$($exe.FullName)"
          $out = Join-Path $env:RUNNER_TEMP "ProxyForge-portable-windows.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          $items = @($exe.FullName)
          $res = Join-Path $rel "resources"
          if (Test-Path $res) { $items += $res }
          Compress-Archive -Path $items -DestinationPath $out -CompressionLevel Optimal
          Get-Item $out | Format-List Name, Length

      - name: 上传构建产物（备份）
        uses: actions/upload-artifact@v4
        with:
          name: ProxyForge-${{ matrix.label }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: warn

      - name: 生成更新器清单
        env:
          UPDATE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: node scripts/gen-updater-manifest.mjs "updater-${{ matrix.platform }}.json"

      # 跨平台兼容的上传（macOS 自带 bash 3.2 不支持 mapfile，统一用 find -print0 | xargs）
      - name: 附加产物到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find src-tauri/target -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
          if [ -f "$RUNNER_TEMP/ProxyForge-portable-windows.zip" ]; then
            gh release upload "$GITHUB_REF_NAME" --clobber "$RUNNER_TEMP/ProxyForge-portable-windows.zip"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "updater-${{ matrix.platform }}.json"

  android:
    name: Android 构建（APK / AAB）
    needs: [test, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # runner 镜像已预装 Android SDK（/usr/local/lib/android/sdk）。
      # 注意：不要再使用 android-actions/setup-android@v3 —— 它内部会执行 sdkmanager 安装已被
      # cmdline-tools 16.0 移除的 "tools" 包，直接以 exit 1 失败。这里改为复用预装 SDK 并定位 sdkmanager。
      - name: 配置 Android SDK 环境
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then echo "::error::未找到预装 Android SDK：$SDK_ROOT"; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_BIN=""
          for d in "$SDK_ROOT"/cmdline-tools/*/bin; do
            if [ -x "$d/sdkmanager" ]; then CMDLINE_BIN="$d"; break; fi
          done
          if [ -z "$CMDLINE_BIN" ]; then echo "::error::未找到 sdkmanager（$SDK_ROOT/cmdline-tools/*/bin）"; exit 1; fi
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "sdkmanager: $CMDLINE_BIN"
          "$CMDLINE_BIN/sdkmanager" --version

      # NDK 是 Rust 交叉编译 Android 原生库的必需组件；Tauri CLI 不会自动下载 NDK，必须显式安装并设 NDK_HOME。
      # Tauri 2.12 生成的模板 compileSdk=36，因此一并安装对应 platform 与 build-tools。
      # 注意：这里不能用 `yes | sdkmanager ...`。Actions 的 bash 默认 `-e -o pipefail`，
      # sdkmanager 正常结束后 yes 会收到 SIGPIPE（yes: standard output: Broken pipe），
      # 整条管道被判为失败（exit 1）。改用有限长度的 here-string 自动应答许可。
      - name: 安装 NDK / SDK 平台 / 构建工具
        shell: bash
        run: |
          LICENSES="$(printf 'y\n%.0s' {1..200})"
          sdkmanager --licenses <<< "$LICENSES" > /dev/null 2>&1 || true
          sdkmanager "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" <<< "$LICENSES"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          ls -1 "$ANDROID_HOME/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      # 现场生成 Android 工程脚手架（仓库不提交 gen/android）；--skip-targets-install 复用上面已装的 Rust 目标
      - name: 初始化 Android 工程
        run: npx tauri android init --ci --skip-targets-install

      # 从仓库 Secret 解码同一份签名密钥库，并注入 gradle 签名配置，保证每次构建签名一致（应用可增量更新）
      - name: 写入签名密钥库并注入 gradle 签名
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > release.p12
          if [ ! -s release.p12 ]; then echo "::error::ANDROID_KEYSTORE_BASE64 为空或 base64 无效"; exit 1; fi
          {
            printf 'storeFile=%s/release.p12\n' "$(pwd)"
            printf 'keyAlias=%s\n' "$KS_ALIAS"
            printf 'storePassword=%s\n' "$KS_STORE_PASS"
            printf 'keyPassword=%s\n' "$KS_KEY_PASS"
          } > keystore.properties
          node ../../../scripts/inject-android-signing.mjs "$(pwd)"

      # 校验密钥库可被 JDK 读取（密码/别名不匹配则尽早失败，避免构建到最后才发现）
      - name: 验证密钥库（fail fast）
        env:
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if ! keytool -list -keystore src-tauri/gen/android/release.p12 -storetype PKCS12 \
            -storepass "$KS_STORE_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "::error::密钥库 / 密码 / 别名不匹配，请检查 ANDROID_KEYSTORE_BASE64 等 Secrets"; exit 1
          fi
          echo "密钥库校验通过"

      - name: 构建 Android 发布包（通用 APK + AAB）
        run: npx tauri android build --ci --apk --aab

      - name: 附加 APK / AAB 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find src-tauri/gen/android -name '*.apk' -path '*release*' -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
          find src-tauri/gen/android -name '*.aab' -path '*release*' -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber

  publish-updater:
    name: 合并更新器清单
    needs: desktop
    # 即使某个平台打包失败也要尝试合并，避免 latest.json 完全缺失（缺失平台在清单里留空）
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载三平台清单并合并为 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p "updater-*.json" -D updater/
          node scripts/merge-updater-manifest.mjs updater/ > latest.json

      - name: 上传 latest.json 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
